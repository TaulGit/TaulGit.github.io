<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Page not found · Taul</title>
    <style>
      :root { --bg: #f7f5f0; --text: #1f2933; --muted: #66727e; --accent: #2c6e73; --line: #dfe3df; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; background: radial-gradient(circle at 20% 0%, #dcefeb, transparent 30rem), var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      main { width: min(100%, 38rem); padding: clamp(2rem, 7vw, 4.5rem); border: 1px solid var(--line); border-radius: 1.5rem; background: rgba(255,255,255,.82); text-align: center; box-shadow: 0 20px 60px rgba(34,52,49,.09); }
      .code { margin: 0; color: var(--accent); font-size: .8rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: .7rem 0 .8rem; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1.05; }
      p { margin: 0 0 1.6rem; color: var(--muted); }
      a { display: inline-flex; padding: .7rem 1rem; border-radius: .7rem; background: var(--accent); color: white; font-weight: 700; text-decoration: none; }
      a:hover { background: #20575c; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 · Page not found</p>
      <h1>这页暂时走丢了。</h1>
      <p>The page you are looking for does not exist or has moved.</p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
